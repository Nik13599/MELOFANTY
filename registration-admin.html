/* Event overview follows the original two-column registration sketch. */
.admin-page-label{position:absolute;left:50%;transform:translateX(-50%);font:700 clamp(18px,2.3vw,29px) Oswald,sans-serif;letter-spacing:.12em;color:#e5fff2}
.event-grid{width:100%;max-width:1050px;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2.5vw,28px);margin-inline:auto}
.event-card{display:flex;flex-direction:column;gap:0;padding:0;border-radius:22px;overflow:hidden;background:linear-gradient(150deg,#0b3023,#051611);transition:transform .2s,border-color .2s}
.event-card:hover{transform:translateY(-2px);border-color:#76ecad}
.poster{width:100%;min-height:0;aspect-ratio:1.18/1;border:0;border-bottom:1px solid #32664c;border-radius:0;position:relative;justify-content:center;align-items:center}
.poster img{object-fit:cover;width:100%;height:100%}
.poster-badge{position:absolute;top:12px;right:12px;padding:6px 10px;border:1px solid #9eff8d84;border-radius:30px;background:#021711e8;color:#baff86;font:600 12px Oswald,sans-serif;letter-spacing:.08em}
.event-info{align-items:stretch;gap:8px;padding:clamp(13px,2vw,23px)}
.event-topline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.event-day{font-size:clamp(31px,4vw,54px)}
.event-venue{font-size:clamp(13px,1.4vw,17px)}
.event-title{font-size:clamp(20px,2.5vw,30px)}
.guest-count{display:flex;align-items:baseline;gap:7px}
.guest-count strong{font:700 clamp(26px,3.3vw,41px) Oswald,sans-serif}
.guest-count span{font-size:clamp(12px,1.6vw,18px);color:#c7e9d8}
.event-card .filters{display:grid;grid-template-columns:minmax(0,1fr) auto;margin-top:8px}
.event-card .filters .btn{width:100%;min-height:43px}
.mf-dock{display:none}
.registration{border-color:#286f51}
.status.pending{color:#ffc873}

/* Each vertical snap page contains at most four compact event cards. */
.view-scroll.events-scroll{scroll-snap-type:y mandatory;scroll-padding-top:0}
.event-page{flex:0 0 100%;width:100%;height:100%;min-height:100%;display:flex;justify-content:center;align-items:center;scroll-snap-align:start;scroll-snap-stop:always}
.event-page .event-grid{margin:auto!important}
.events-scroll .event-page .event-grid{max-width:900px}

<script>
(function(){

 if(options&&options.method&&options.method!=='GET')mutationRevision++;

function pdfReportCanvas(event,registrations){

  }

  text(c,'ИМЯ',M+200,y+32,300,'bold 23px Arial','#ffffff');
  text(c,'НОМЕР ТЕЛЕФОНА',M+530,y+32,380,'bold 23px Arial','#ffffff');

  var words=String(value||'').trim().replace(/\s+/g,' ').split(' '),lines=[],current='';

   if(!words[i])continue;

function imageStatus(node,message,isError){
 if(!node)return;

}
function imageMime(file){
 if(typeof file==='string')return ((file.match(/^data:(image\/[a-z0-9+.-]+);base64,/i)||[])[1]||'').toLowerCase();
 var kind=String(file&&file.type||'').toLowerCase();
 if(kind==='image/jpg')return 'image/jpeg';
 if(!kind||kind==='application/octet-stream'){
  var extension=String(file&&file.name||'').toLowerCase().split('.').pop();
  kind=({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',avif:'image/avif',heic:'image/heic',heif:'image/heif'})[extension]||kind;
 }
 return kind;
}
function clearUploadPreview(preview){
 if(preview.dataset.blobUrl){URL.revokeObjectURL(preview.dataset.blobUrl);delete preview.dataset.blobUrl;}
 preview.onload=null;preview.onerror=null;
}
function showUploadPreview(file,preview){
 if(!file)return;
 if(!/^image\/(png|jpeg|webp|gif|avif|heic|heif)$/i.test(imageMime(file))){
  errMessage(new Error('Выберите изображение JPG, PNG, WebP, GIF, AVIF или HEIC'));return;
 }
 clearUploadPreview(preview);
 var url=URL.createObjectURL(file);preview.dataset.blobUrl=url;
 preview.onload=function(){clearUploadPreview(preview);};
 preview.onerror=function(){
  clearUploadPreview(preview);preview.hidden=true;
  errMessage(new Error('Предпросмотр недоступен для этого формата. При сохранении будет сделана ещё одна попытка обработки.'));
 };
 preview.src=url;preview.hidden=false;
}
async function imageForSave(upload,previous,square){

}
function nativeWebpAvailable(){
 if(nativeWebpAvailable.cached!==undefined)return nativeWebpAvailable.cached;
 try{
  var probe=document.createElement('canvas');probe.width=probe.height=2;
  nativeWebpAvailable.cached=probe.toDataURL('image/webp').startsWith('data:image/webp;base64,');
 }catch(error){nativeWebpAvailable.cached=false;}
 return nativeWebpAvailable.cached;
}
function imageBlobDataUrl(blob){
 return new Promise(function(resolve,reject){
  var reader=new FileReader();
  reader.onerror=function(){reject(new Error('Не удалось прочитать готовое изображение WebP'));};
  reader.onload=function(){resolve(String(reader.result||''));};
  reader.readAsDataURL(blob);
 });
}
var wasmWebpEncoder=null;
async function getWasmWebpEncoder(){
 // iPhone Chrome runs WebKit, which does not implement Canvas WebP encoding.
 // Apache-2.0 codec from jSquash/Squoosh, loaded only on browsers needing it.
 if(!wasmWebpEncoder){
  wasmWebpEncoder=import('https://esm.sh/@jsquash/webp@1.5.0').then(function(codec){
   if(!codec||typeof codec.encode!=='function')throw new Error('Кодек WebP не загрузился');
   return codec;
  }).catch(function(error){
   wasmWebpEncoder=null;
   throw new Error('Не удалось загрузить WebP-конвертер для iPhone. Проверьте интернет и повторите. '+(error&&error.message||''));
  });
 }
 return wasmWebpEncoder;
}
async function encodeCanvasWebp(canvas,quality){
 if(nativeWebpAvailable()){
  // toBlob is asynchronous and uses less peak memory on mobile Chrome.
  if(typeof canvas.toBlob==='function'){
   var blob=await new Promise(function(resolve){
    try{canvas.toBlob(resolve,'image/webp',quality);}catch(e){resolve(null);}
   });
   if(blob&&blob.type==='image/webp')return imageBlobDataUrl(blob);
  }
  var data=canvas.toDataURL('image/webp',quality);
  if(data.startsWith('data:image/webp;base64,'))return data;
 }
 // Safari / iOS Chrome / older WebKit: encode WebP with WebAssembly.
 var codec=await getWasmWebpEncoder();
 var ctx=canvas.getContext('2d',{willReadFrequently:true});
 if(!ctx)throw new Error('Не удалось получить данные изображения');
 var rgba=ctx.getImageData(0,0,canvas.width,canvas.height);
 var binary=await codec.encode(rgba,{quality:Math.round(quality*100)});
 return imageBlobDataUrl(new Blob([binary],{type:'image/webp'}));
}
async function compressImage(file,square){
 if(!file)return '';
 var isDataUrl=typeof file==='string',mime=imageMime(file);
 if(!/^image\/(png|jpeg|webp|gif|avif|heic|heif)$/i.test(mime||'')){
  throw new Error('Неподдерживаемый формат. Выберите JPG, PNG, WebP, GIF, AVIF или HEIC');
 }
 var url=isDataUrl?file:URL.createObjectURL(file),image=new Image();
 try{
  await new Promise(function(resolve,reject){
   image.onload=resolve;
   image.onerror=function(){
    reject(new Error('Не удалось открыть изображение на этом телефоне. Для HEIC попробуйте выбрать фото из галереи, а не из приложения «Файлы», либо используйте JPG.'));
   };
   image.src=url;
  });
  var longest=Math.max(image.naturalWidth,image.naturalHeight);
  if(!longest)throw new Error('Не удалось прочитать изображение');
  // Small canvases protect iPhone and Android from large memory spikes.
  for(var maxSide of [900,740,600,480,360]){
   var scale=Math.min(1,maxSide/longest);
   var width=Math.max(1,Math.round(image.naturalWidth*scale));
   var height=Math.max(1,Math.round(image.naturalHeight*scale));
   var edge=Math.max(width,height),canvas=document.createElement('canvas');
   canvas.width=square?edge:width;canvas.height=square?edge:height;
   var ctx=canvas.getContext('2d');
   if(!ctx)throw new Error('Не удалось обработать фото. Закройте лишние вкладки и повторите.');
   if(square){ctx.fillStyle='#061911';ctx.fillRect(0,0,canvas.width,canvas.height);}
   ctx.drawImage(image,square?Math.floor((canvas.width-width)/2):0,square?Math.floor((canvas.height-height)/2):0,width,height);
   for(var quality of [.82,.66,.48,.32]){
    var result=await encodeCanvasWebp(canvas,quality);
    if(!result.startsWith('data:image/webp;base64,'))throw new Error('Конвертер не смог создать WebP');
    if(result.length<175000)return result;
   }
   canvas.width=canvas.height=0;
  }
  throw new Error('Изображение не удалось сжать до допустимого размера. Попробуйте другую фотографию.');
 }finally{if(!isDataUrl)URL.revokeObjectURL(url);}
}

    this.texcoordX = 0;
    this.texcoordY = 0;
    this.prevTexcoordX = 0;
    this.prevTexcoordY = 0;
    this.deltaX = 0;
    this.deltaY = 0;
    this.down = false;
    this.moved = false;

  let pointers = [];
  pointers.push(new pointerPrototype());

  const { gl, ext } = getWebGLContext(canvas);

  if (!ext.supportLinearFiltering) {
    config.DYE_RESOLUTION = 256;
    config.SHADING = false;
  }

  function getWebGLContext(canvas) {
    const params = { alpha: true, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };

    let gl = canvas.getContext('webgl2', params);
    const isWebGL2 = !!gl;
    if (!isWebGL2) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
    if(!gl)throw Error('WebGL is unavailable');

    let halfFloat;
    let supportLinearFiltering;
    if (isWebGL2) {
      gl.getExtension('EXT_color_buffer_float');
      supportLinearFiltering = gl.getExtension('OES_texture_float_linear');
    } else {
      halfFloat = gl.getExtension('OES_texture_half_float');
      if(!halfFloat)throw Error('WebGL half float not supported');
      supportLinearFiltering = gl.getExtension('OES_texture_half_float_linear');
    }

    gl.clearColor(0.0, 0.0, 0.0, 1.0);

    const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : halfFloat.HALF_FLOAT_OES;
    let formatRGBA;
    let formatRG;
    let formatR;

    if (isWebGL2) {
      formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
      formatRG = getSupportedFormat(gl, gl.RG16F, gl.RG, halfFloatTexType);
      formatR = getSupportedFormat(gl, gl.R16F, gl.RED, halfFloatTexType);
    } else {
      formatRGBA = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
      formatRG = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
      formatR = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);

      gl,
      ext: {
        formatRGBA,
        formatRG,
        formatR,
        halfFloatTexType,
        supportLinearFiltering,
      },
    };

  function getSupportedFormat(gl, internalFormat, format, type) {
    if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
      switch (internalFormat) {
        case gl.R16F:

  function supportRenderTextureFormat(gl, internalFormat, format, type) {

  class Material {
    constructor(vertexShader, fragmentShaderSource) {
      this.vertexShader = vertexShader;
      this.fragmentShaderSource = fragmentShaderSource;
      this.programs = [];
      this.activeProgram = null;
      this.uniforms = [];
    }

    setKeywords(keywords) {
      let hash = 0;
      for (let i = 0; i < keywords.length; i++) hash += hashCode(keywords[i]);

      let program = this.programs[hash];

      this.uniforms = getUniforms(program);
      this.activeProgram = program;
    }

      gl.useProgram(this.activeProgram);
    }

    constructor(vertexShader, fragmentShader) {
      this.uniforms = {};
      this.program = createProgram(vertexShader, fragmentShader);
      this.uniforms = getUniforms(this.program);
    }

    bind() {

    }
  }

    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) console.trace(gl.getProgramInfoLog(program));

  }

    let uniformCount = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);

    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    let keywordsString = '';

    attribute vec2 aPosition;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;

        vR = vUv + vec2(texelSize.x, 0.0);
        vT = vUv + vec2(0.0, texelSize.y);
        vB = vUv - vec2(0.0, texelSize.y);
        gl_Position = vec4(aPosition, 0.0, 1.0);
    }
`,
  );

    gl.VERTEX_SHADER,
    `
    precision highp float;

    attribute vec2 aPosition;
    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    uniform vec2 texelSize;

    void main () {
        vUv = aPosition * 0.5 + 0.5;
        float offset = 1.33333333;
        vL = vUv - texelSize * offset;
        vR = vUv + texelSize * offset;
        gl_Position = vec4(aPosition, 0.0, 1.0);
    }
`,
  );

  const blurShader = compileShader(
    gl.FRAGMENT_SHADER,
    `
    precision mediump float;
    precision mediump sampler2D;

    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    uniform sampler2D uTexture;

    void main () {

        sum += texture2D(uTexture, vL) * 0.35294117;
        sum += texture2D(uTexture, vR) * 0.35294117;
        gl_FragColor = sum;

  );

    gl.FRAGMENT_SHADER,
    `
    precision mediump float;
    precision mediump sampler2D;

    varying highp vec2 vUv;
    uniform sampler2D uTexture;

    void main () {
        gl_FragColor = texture2D(uTexture, vUv);
    }
`,
  );

  const clearShader = compileShader(
    gl.FRAGMENT_SHADER,
    `
    precision mediump float;
    precision mediump sampler2D;

    varying highp vec2 vUv;
    uniform sampler2D uTexture;
    uniform float value;

    void main () {
        gl_FragColor = value * texture2D(uTexture, vUv);

    }

    precision highp sampler2D;

    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;

        vec3 tc = texture2D(uTexture, vT).rgb;

        c *= diffuse;

        gl_FragColor = vec4(c, a);
    }

    gl.FRAGMENT_SHADER,

    precision highp sampler2D;

    varying vec2 vUv;
    uniform sampler2D uTarget;
    uniform float aspectRatio;
    uniform vec3 color;
    uniform vec2 point;
    uniform float radius;

    void main () {

        p.x *= aspectRatio;
        vec3 splat = exp(-dot(p, p) / radius) * color;
        vec3 base = texture2D(uTarget, vUv).xyz;
        gl_FragColor = vec4(base + splat, 1.0);
    }

  );

    gl.FRAGMENT_SHADER,
    `

    precision highp sampler2D;

    varying vec2 vUv;
    uniform sampler2D uVelocity;
    uniform sampler2D uSource;
    uniform vec2 texelSize;
    uniform vec2 dyeTexelSize;
    uniform float dt;
    uniform float dissipation;

        vec2 iuv = floor(st);
        vec2 fuv = fract(st);

        vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
        vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
        vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
        vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);

    }

        vec4 result = bilerp(uSource, coord, dyeTexelSize);
    #else

    gl.FRAGMENT_SHADER,
    `
    precision mediump float;
    precision mediump sampler2D;

    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uVelocity;

    void main () {
        float L = texture2D(uVelocity, vL).x;
        float R = texture2D(uVelocity, vR).x;
        float T = texture2D(uVelocity, vT).y;
        float B = texture2D(uVelocity, vB).y;

        vec2 C = texture2D(uVelocity, vUv).xy;
        if (vL.x < 0.0) { L = -C.x; }
        if (vR.x > 1.0) { R = -C.x; }
        if (vT.y > 1.0) { T = -C.y; }
        if (vB.y < 0.0) { B = -C.y; }

        float div = 0.5 * (R - L + T - B);
        gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
    }
`,
  );

  const curlShader = compileShader(
    gl.FRAGMENT_SHADER,
    `
    precision mediump float;
    precision mediump sampler2D;

    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uVelocity;

    void main () {
        float L = texture2D(uVelocity, vL).y;
        float R = texture2D(uVelocity, vR).y;
        float T = texture2D(uVelocity, vT).x;
        float B = texture2D(uVelocity, vB).x;
        float vorticity = R - L - T + B;
        gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
    }
`,
  );

  const vorticityShader = compileShader(
    gl.FRAGMENT_SHADER,
    `
    precision highp float;
    precision highp sampler2D;

    varying vec2 vUv;
    varying vec2 vL;
    varying vec2 vR;
    varying vec2 vT;
    varying vec2 vB;
    uniform sampler2D uVelocity;
    uniform sampler2D uCurl;
    uniform float curl;
    uniform float dt;

    void main () {
        float L = texture2D(uCurl, vL).x;
        float R = texture2D(uCurl, vR).x;
        float T = texture2D(uCurl, vT).x;
        float B = texture2D(uCurl, vB).x;
        float C = texture2D(uCurl, vUv).x;

        vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
        force /= length(force) + 0.0001;
        force *= curl * C;
        force.y *= -1.0;

        vec2 velocity = texture2D(uVelocity, vUv).xy;
        velocity += force * dt;
        velocity = min(max(velocity, -1000.0), 1000.0);
        gl_FragColor = vec4(velocity, 0.0, 1.0);
    }
`,
  );

  const pressureShader = compileShader(
    gl.FRAGMENT_SHADER,
    `
    precision mediump float;
    precision mediump sampler2D;

    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uPressure;
    uniform sampler2D uDivergence;

    void main () {
        float L = texture2D(uPressure, vL).x;
        float R = texture2D(uPressure, vR).x;
        float T = texture2D(uPressure, vT).x;
        float B = texture2D(uPressure, vB).x;
        float C = texture2D(uPressure, vUv).x;
        float divergence = texture2D(uDivergence, vUv).x;
        float pressure = (L + R + B + T - divergence) * 0.25;
        gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
    }
`,
  );

  const gradientSubtractShader = compileShader(
    gl.FRAGMENT_SHADER,
    `
    precision mediump float;
    precision mediump sampler2D;

    varying highp vec2 vUv;
    varying highp vec2 vL;
    varying highp vec2 vR;
    varying highp vec2 vT;
    varying highp vec2 vB;
    uniform sampler2D uPressure;
    uniform sampler2D uVelocity;

    void main () {
        float L = texture2D(uPressure, vL).x;
        float R = texture2D(uPressure, vR).x;
        float T = texture2D(uPressure, vT).x;
        float B = texture2D(uPressure, vB).x;
        vec2 velocity = texture2D(uVelocity, vUv).xy;
        velocity.xy -= vec2(R - L, T - B);
        gl_FragColor = vec4(velocity, 0.0, 1.0);
    }
`,
  );

  const blit = (() => {
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(0);

    return (target, clear = false) => {
      if (target == null) {
        gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      } else {
        gl.viewport(0, 0, target.width, target.height);
        gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
      }
      if (clear) {
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
      // CHECK_FRAMEBUFFER_STATUS();
      gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
    };
  })();

  function CHECK_FRAMEBUFFER_STATUS() {
    let status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    if (status != gl.FRAMEBUFFER_COMPLETE) console.trace('Framebuffer error: ' + status);
  }

  let dye;
  let velocity;
  let divergence;
  let curl;
  let pressure;
  // Dithering asset is not required for transparent smoke.

  const blurProgram = new Program(blurVertexShader, blurShader);
  const copyProgram = new Program(baseVertexShader, copyShader);
  const clearProgram = new Program(baseVertexShader, clearShader);
  const colorProgram = new Program(baseVertexShader, colorShader);
  const splatProgram = new Program(baseVertexShader, splatShader);
  const advectionProgram = new Program(baseVertexShader, advectionShader);
  const divergenceProgram = new Program(baseVertexShader, divergenceShader);
  const curlProgram = new Program(baseVertexShader, curlShader);
  const vorticityProgram = new Program(baseVertexShader, vorticityShader);
  const pressureProgram = new Program(baseVertexShader, pressureShader);
  const gradienSubtractProgram = new Program(baseVertexShader, gradientSubtractShader);

  const displayMaterial = new Material(baseVertexShader, displayShaderSource);

  function initFramebuffers() {
    let simRes = getResolution(config.SIM_RESOLUTION);
    let dyeRes = getResolution(config.DYE_RESOLUTION);

    const texType = ext.halfFloatTexType;
    const rgba = ext.formatRGBA;
    const rg = ext.formatRG;
    const r = ext.formatR;
    const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

    gl.disable(gl.BLEND);

    if (dye == null)
      dye = createDoubleFBO(dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);
    else dye = resizeDoubleFBO(dye, dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);

    if (velocity == null)
      velocity = createDoubleFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);
    else
      velocity = resizeDoubleFBO(
        velocity,
        simRes.width,
        simRes.height,
        rg.internalFormat,
        rg.format,
        texType,
        filtering,
      );

    divergence = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
    curl = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
    pressure = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
  }

  function createFBO(w, h, internalFormat, format, type, param) {
    gl.activeTexture(gl.TEXTURE0);
    let texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);

    let fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.viewport(0, 0, w, h);
    gl.clear(gl.COLOR_BUFFER_BIT);

    let texelSizeX = 1.0 / w;
    let texelSizeY = 1.0 / h;

    return {
      texture,
      fbo,
      width: w,
      height: h,
      texelSizeX,
      texelSizeY,
      attach(id) {
        gl.activeTexture(gl.TEXTURE0 + id);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        return id;
      },
    };
  }

  function createDoubleFBO(w, h, internalFormat, format, type, param) {
    let fbo1 = createFBO(w, h, internalFormat, format, type, param);
    let fbo2 = createFBO(w, h, internalFormat, format, type, param);

    return {
      width: w,
      height: h,
      texelSizeX: fbo1.texelSizeX,
      texelSizeY: fbo1.texelSizeY,
      get read() {
        return fbo1;
      },
      set read(value) {
        fbo1 = value;
      },
      get write() {
        return fbo2;
      },
      set write(value) {
        fbo2 = value;
      },
      swap() {
        let temp = fbo1;
        fbo1 = fbo2;
        fbo2 = temp;
      },
    };
  }

  function resizeFBO(target, w, h, internalFormat, format, type, param) {
    let newFBO = createFBO(w, h, internalFormat, format, type, param);
    copyProgram.bind();
    gl.uniform1i(copyProgram.uniforms.uTexture, target.attach(0));
    blit(newFBO);
    return newFBO;
  }

  function resizeDoubleFBO(target, w, h, internalFormat, format, type, param) {
    if (target.width == w && target.height == h) return target;
    target.read = resizeFBO(target.read, w, h, internalFormat, format, type, param);
    target.write = createFBO(w, h, internalFormat, format, type, param);
    target.width = w;
    target.height = h;
    target.texelSizeX = 1.0 / w;
    target.texelSizeY = 1.0 / h;
    return target;
  }

  function createTextureAsync(url) {
    let texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array([255, 255, 255]));

    let obj = {
      texture,
      width: 1,
      height: 1,
      attach(id) {
        gl.activeTexture(gl.TEXTURE0 + id);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        return id;
      },
    };

    let image = new Image();
    image.onload = () => {
      obj.width = image.width;
      obj.height = image.height;
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, image);
    };
    image.src = url;

    return obj;
  }

  function updateKeywords() {
    let displayKeywords = [];
    if (config.SHADING) displayKeywords.push('SHADING');
    displayMaterial.setKeywords(displayKeywords);
  }

  updateKeywords();
  initFramebuffers();

  let lastUpdateTime = Date.now();
  let frameId=0,lastInput=0,lastDraw=0;
  function startLoop(){lastInput=performance.now();if(!frameId)frameId=requestAnimationFrame(update)}
  let colorUpdateTimer = 0.0;

  function update(now) {
    frameId=0;
    if(document.hidden)return;
    if(isTouch && now-lastDraw<22){frameId=requestAnimationFrame(update);return}
    lastDraw=now;
    const dt=calcDeltaTime();
    if(resizeCanvas())initFramebuffers();
    updateColors(dt);
    applyInputs();
    step(dt);
    render(null);
    if(now-lastInput<3600){frameId=requestAnimationFrame(update)}
    else{gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)}
  }

  function calcDeltaTime() {
    let now = Date.now();
    let dt = (now - lastUpdateTime) / 1000;
    dt = Math.min(dt, 0.016666);
    lastUpdateTime = now;
    return dt;
  }

  function resizeCanvas() {
    let width = scaleByPixelRatio(canvas.clientWidth);
    let height = scaleByPixelRatio(canvas.clientHeight);
    if (canvas.width != width || canvas.height != height) {
      canvas.width = width;
      canvas.height = height;
      return true;
    }
    return false;
  }

  function updateColors(dt) {
    colorUpdateTimer += dt * config.COLOR_UPDATE_SPEED;
    if (colorUpdateTimer >= 1) {
      colorUpdateTimer = wrap(colorUpdateTimer, 0, 1);
      pointers.forEach((p) => {
        p.color = generateColor();
      });
    }
  }

  function applyInputs() {
    pointers.forEach((p) => {
      if (p.moved) {
        p.moved = false;
        splatPointer(p);
      }
    });
  }

  function step(dt) {
    gl.disable(gl.BLEND);

    curlProgram.bind();
    gl.uniform2f(curlProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
    blit(curl);

    vorticityProgram.bind();
    gl.uniform2f(vorticityProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
    gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
    gl.uniform1f(vorticityProgram.uniforms.dt, dt);
    blit(velocity.write);
    velocity.swap();

    divergenceProgram.bind();
    gl.uniform2f(divergenceProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
    blit(divergence);

    clearProgram.bind();
    gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
    gl.uniform1f(clearProgram.uniforms.value, config.PRESSURE);
    blit(pressure.write);
    pressure.swap();

    pressureProgram.bind();
    gl.uniform2f(pressureProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
    for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
      gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
      blit(pressure.write);
      pressure.swap();
    }

    gradienSubtractProgram.bind();
    gl.uniform2f(gradienSubtractProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(gradienSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
    gl.uniform1i(gradienSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
    blit(velocity.write);
    velocity.swap();

    advectionProgram.bind();
    gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    if (!ext.supportLinearFiltering)
      gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
    let velocityId = velocity.read.attach(0);
    gl.uniform1i(advectionProgram.uniforms.uVelocity, velocityId);
    gl.uniform1i(advectionProgram.uniforms.uSource, velocityId);
    gl.uniform1f(advectionProgram.uniforms.dt, dt);
    gl.uniform1f(advectionProgram.uniforms.dissipation, config.VELOCITY_DISSIPATION);
    blit(velocity.write);
    velocity.swap();

    if (!ext.supportLinearFiltering)
      gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
    gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(advectionProgram.uniforms.uSource, dye.read.attach(1));
    gl.uniform1f(advectionProgram.uniforms.dissipation, config.DENSITY_DISSIPATION);
    blit(dye.write);
    dye.swap();
  }

  function render(target) {
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.enable(gl.BLEND);
    drawDisplay(target);
  }

  function drawDisplay(target) {
    let width = target == null ? gl.drawingBufferWidth : target.width;
    let height = target == null ? gl.drawingBufferHeight : target.height;

    displayMaterial.bind();
    if (config.SHADING) gl.uniform2f(displayMaterial.uniforms.texelSize, 1.0 / width, 1.0 / height);
    gl.uniform1i(displayMaterial.uniforms.uTexture, dye.read.attach(0));
    blit(target);
  }

  function splatPointer(pointer) {
    let dx = pointer.deltaX * config.SPLAT_FORCE;
    let dy = pointer.deltaY * config.SPLAT_FORCE;
    splat(pointer.texcoordX, pointer.texcoordY, dx, dy, pointer.color);
  }

  function clickSplat(pointer) {
    const color = generateColor();
    color.r *= 10.0;
    color.g *= 10.0;
    color.b *= 10.0;
    let dx = 10 * (Math.random() - 0.5);
    let dy = 30 * (Math.random() - 0.5);
    splat(pointer.texcoordX, pointer.texcoordY, dx, dy, color);
  }

  function splat(x, y, dx, dy, color) {
    splatProgram.bind();
    gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
    gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
    gl.uniform2f(splatProgram.uniforms.point, x, y);
    gl.uniform3f(splatProgram.uniforms.color, dx, dy, 0.0);
    gl.uniform1f(splatProgram.uniforms.radius, correctRadius(config.SPLAT_RADIUS / 100.0));
    blit(velocity.write);
    velocity.swap();

    gl.uniform1i(splatProgram.uniforms.uTarget, dye.read.attach(0));
    gl.uniform3f(splatProgram.uniforms.color, color.r, color.g, color.b);
    blit(dye.write);
    dye.swap();
  }

  function correctRadius(radius) {
    let aspectRatio = canvas.width / canvas.height;
    if (aspectRatio > 1) radius *= aspectRatio;
    return radius;
  }

  // Input is observed passively. The canvas itself never intercepts taps, swipes or clicks.
  let mouseReady=false,activeFinger=null;
  window.addEventListener('mousemove',(e)=>{
    if(isTouch)return;
    const x=scaleByPixelRatio(e.clientX),y=scaleByPixelRatio(e.clientY);
    if(!mouseReady){updatePointerDownData(pointers[0],-1,x,y);mouseReady=true;return}
    updatePointerMoveData(pointers[0],x,y,pointers[0].color);
    startLoop();
  },{passive:true});
  document.addEventListener('touchstart',(e)=>{
    if(activeFinger!==null||!e.changedTouches.length)return;
    const t=e.changedTouches[0];
    activeFinger=t.identifier;
    updatePointerDownData(pointers[0],activeFinger,scaleByPixelRatio(t.clientX),scaleByPixelRatio(t.clientY));
  },{passive:true,capture:true});
  document.addEventListener('touchmove',(e)=>{
    if(activeFinger===null)return;
    const t=Array.from(e.touches).find(t=>t.identifier===activeFinger);
    if(!t)return;
    updatePointerMoveData(pointers[0],scaleByPixelRatio(t.clientX),scaleByPixelRatio(t.clientY),pointers[0].color);
    startLoop();
  },{passive:true,capture:true});
  const touchEnd=e=>{
    if(activeFinger===null)return;
    if(Array.from(e.changedTouches).some(t=>t.identifier===activeFinger)){
      updatePointerUpData(pointers[0]);activeFinger=null;
    }
  };
  document.addEventListener('touchend',touchEnd,{passive:true,capture:true});
  document.addEventListener('touchcancel',touchEnd,{passive:true,capture:true});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(frameId)cancelAnimationFrame(frameId);frameId=0}
  });
  canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();if(frameId)cancelAnimationFrame(frameId);frameId=0},{passive:false});
  // Stop GPU drawing if the visitor has requested reduced motion.
  const reduction=matchMedia('(prefers-reduced-motion: reduce)');
  if(reduction.addEventListener)reduction.addEventListener('change',e=>{
    canvas.style.display=e.matches?'none':'block';
    if(e.matches&&frameId){cancelAnimationFrame(frameId);frameId=0}
  });
  function updatePointerDownData(pointer, id, posX, posY) {
    pointer.id = id;
    pointer.down = true;
    pointer.moved = false;
    pointer.texcoordX = posX / canvas.width;
    pointer.texcoordY = 1.0 - posY / canvas.height;
    pointer.prevTexcoordX = pointer.texcoordX;
    pointer.prevTexcoordY = pointer.texcoordY;
    pointer.deltaX = 0;
    pointer.deltaY = 0;
    pointer.color = generateColor();
  }

  function updatePointerMoveData(pointer, posX, posY, color) {
    // pointer.down = false;
    pointer.prevTexcoordX = pointer.texcoordX;
    pointer.prevTexcoordY = pointer.texcoordY;
    pointer.texcoordX = posX / canvas.width;
    pointer.texcoordY = 1.0 - posY / canvas.height;
    pointer.deltaX = correctDeltaX(pointer.texcoordX - pointer.prevTexcoordX);
    pointer.deltaY = correctDeltaY(pointer.texcoordY - pointer.prevTexcoordY);
    pointer.moved = Math.abs(pointer.deltaX) > 0 || Math.abs(pointer.deltaY) > 0;
    pointer.color = color;
  }

  function updatePointerUpData(pointer) {
    pointer.down = false;
  }

  function correctDeltaX(delta) {
    let aspectRatio = canvas.width / canvas.height;
    if (aspectRatio < 1) delta *= aspectRatio;
    return delta;
  }

  function correctDeltaY(delta) {
    let aspectRatio = canvas.width / canvas.height;
    if (aspectRatio > 1) delta /= aspectRatio;
    return delta;
  }

  function generateColor() {
    const t=Math.random();
    // Exact project accent hues, softened into fluid dye rather than a laser.
    return {r:(.647*(1-t)+.086*t)*.52,
            g:(.992*(1-t)+.902*t)*.52,
            b:(.384*(1-t)+.816*t)*.52};
  }
  function HSVtoRGB(h, s, v) {
    let r, g, b, i, f, p, q, t;
    i = Math.floor(h * 6);
    f = h * 6 - i;
    p = v * (1 - s);
    q = v * (1 - f * s);
    t = v * (1 - (1 - f) * s);

    switch (i % 6) {
      case 0:
        (r = v), (g = t), (b = p);
        break;
      case 1:
        (r = q), (g = v), (b = p);
        break;
      case 2:
        (r = p), (g = v), (b = t);
        break;
      case 3:
        (r = p), (g = q), (b = v);
        break;
      case 4:
        (r = t), (g = p), (b = v);
        break;
      case 5:
        (r = v), (g = p), (b = q);
        break;
    }

    return {
      r,
      g,
      b,
    };
  }

  function wrap(value, min, max) {
    let range = max - min;
    if (range == 0) return min;
    return ((value - min) % range) + min;
  }

  function getResolution(resolution) {
    let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
    if (aspectRatio < 1) aspectRatio = 1.0 / aspectRatio;

    let min = Math.round(resolution);
    let max = Math.round(resolution * aspectRatio);

    if (gl.drawingBufferWidth > gl.drawingBufferHeight) return { width: max, height: min };
    else return { width: min, height: max };
  }

  function scaleByPixelRatio(input) {
    let pixelRatio = Math.min(window.devicePixelRatio||1,isTouch?1.3:1.65);
    return Math.floor(input * pixelRatio);
  }

  function hashCode(s) {
    if (s.length == 0) return 0;
    let hash = 0;
    for (let i = 0; i < s.length; i++) {
      hash = (hash << 5) - hash + s.charCodeAt(i);
      hash |= 0; // Convert to 32bit integer
    }
    return hash;
  }
};

try{initCursor()}catch(error){
  // Graceful fallback: the normal interface remains functional if WebGL is unsupported.
  document.getElementById('mf-fluid-canvas')?.remove();
  window.__mfFluidSmokeInitialized=false;
  console.warn('MELOFANTY GPU smoke unavailable; using soft 2D smoke:',error.message);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const canvas=document.createElement('canvas');
  canvas.id='mf-smoke-fallback';canvas.setAttribute('aria-hidden','true');
  canvas.style.cssText='position:fixed;inset:0;width:100vw;height:100dvh;z-index:8;opacity:.64;pointer-events:none!important;mix-blend-mode:screen';
  document.body.append(canvas);
  const ctx=canvas.getContext('2d',{alpha:true,desynchronized:true});
  if(!ctx)return;
  let smoke=[],last=null,raf=0,scale=1;
  const mobile=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
  const resize=()=>{scale=Math.min(devicePixelRatio||1,1.4);canvas.width=Math.round(innerWidth*scale);canvas.height=Math.round(innerHeight*scale);ctx.setTransform(scale,0,0,scale,0,0)};
  resize();window.addEventListener('resize',resize,{passive:true});
  const puff=(x,y)=>{
    if(!last){last={x,y};return}
    const d=Math.hypot(x-last.x,y-last.y);
    if(d<3)return;
    if(d>170){last={x,y};return}
    const count=Math.min(11,Math.ceil(d/8));
    for(let i=0;i<count;i++){
      const t=i/count;
      smoke.push({x:last.x+(x-last.x)*t,y:last.y+(y-last.y)*t,r:14+Math.random()*17,vx:(Math.random()-.5)*.65,vy:-.2-Math.random()*.5,start:performance.now(),life:850+Math.random()*650,c:Math.random()>.5?0:1});
    }
    if(smoke.length>140)smoke.splice(0,smoke.length-140);
    last={x,y};if(!raf)raf=requestAnimationFrame(draw);
  };
  function draw(now){
    raf=0;ctx.clearRect(0,0,innerWidth,innerHeight);
    ctx.save();ctx.globalCompositeOperation='lighter';
    smoke=smoke.filter(s=>now-s.start<s.life);
    for(const s of smoke){
      const t=(now-s.start)/s.life,fade=Math.pow(1-t,1.8);
      s.x+=s.vx;s.y+=s.vy;
      const r=s.r*(1+t*.8);
      const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,r);
      const color=s.c?'22,230,208':'165,253,98';
      g.addColorStop(0,'rgba('+color+','+(fade*.19)+')');
      g.addColorStop(.45,'rgba('+color+','+(fade*.09)+')');
      g.addColorStop(1,'rgba('+color+',0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    if(smoke.length)raf=requestAnimationFrame(draw);
  }
  document.addEventListener('touchstart',e=>{if(e.touches[0])last={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
  document.addEventListener('touchmove',e=>{if(e.touches[0])puff(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  document.addEventListener('touchend',()=>last=null,{passive:true});
  if(!mobile)window.addEventListener('mousemove',e=>puff(e.clientX,e.clientY),{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){smoke=[];last=null;if(raf)cancelAnimationFrame(raf);raf=0}},{passive:true});
}

})();
</script>
</body></html>
