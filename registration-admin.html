/* Event overview follows the original two-column registration sketch. */
.admin-page-label{position:absolute;left:50%;transform:translateX(-50%);font:700 clamp(18px,2.3vw,29px) Oswald,sans-serif;letter-spacing:.12em;color:#e5fff2}
.event-grid{width:100%;max-width:1050px;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2.5vw,28px);margin-inline:auto}
.event-card{display:flex;flex-direction:column;gap:0;padding:0;border-radius:22px;overflow:hidden;background:linear-gradient(150deg,#0b3023,#051611);transition:transform .2s,border-color .2s}
.event-card:hover{transform:translateY(-2px);border-color:#76ecad}
.poster{width:100%;min-height:0;aspect-ratio:1.18/1;border:0;border-bottom:1px solid #32664c;border-radius:0;position:relative;justify-content:center;align-items:center}
.poster img{object-fit:cover;width:100%;height:100%}
.poster-badge{position:absolute;top:12px;right:12px;padding:6px 10px;border:1px solid #9eff8d84;border-radius:30px;background:#021711e8;color:#baff86;font:600 12px Oswald,sans-serif;letter-spacing:.08em}
.event-info{align-items:stretch;gap:8px;padding:clamp(13px,2vw,23px)}
.event-topline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.event-day{font-size:clamp(31px,4vw,54px)}
.event-venue{font-size:clamp(13px,1.4vw,17px)}
.event-title{font-size:clamp(20px,2.5vw,30px)}
.guest-count{display:flex;align-items:baseline;gap:7px}
.guest-count strong{font:700 clamp(26px,3.3vw,41px) Oswald,sans-serif}
.guest-count span{font-size:clamp(12px,1.6vw,18px);color:#c7e9d8}
.event-card .filters{display:grid;grid-template-columns:minmax(0,1fr) auto;margin-top:8px}
.event-card .filters .btn{width:100%;min-height:43px}
.mf-dock{display:none}
.registration{border-color:#286f51}
.status.pending{color:#ffc873}

/* Each vertical snap page contains at most four compact event cards. */
.view-scroll.events-scroll{scroll-snap-type:y mandatory;scroll-padding-top:0}
.event-page{flex:0 0 100%;width:100%;height:100%;min-height:100%;display:flex;justify-content:center;align-items:center;scroll-snap-align:start;scroll-snap-stop:always}
.event-page .event-grid{margin:auto!important}
.events-scroll .event-page .event-grid{max-width:900px}

async function saveEventReport(event,format){

  var data=await api('/events/'+encodeURIComponent(event.id)),blob;
  if(format==='xlsx')blob=reportExcelXlsx(data.event,data.registrations||[]);
  else blob=pdfReportCanvas(data.event,data.registrations||[]);
  var suffix=day(event.starts_at).replace(/[^0-9]/g,'');
  var ext=format==='xlsx'?'xlsx':'pdf';
  var filename='MELOFANTY_'+suffix+'_registracii.'+ext;
  var url=URL.createObjectURL(blob);
  var anchor=document.createElement('a');anchor.href=url;anchor.download=filename;
  document.body.append(anchor);anchor.click();anchor.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},60000);

function fitEventGrid(){

 viewport.querySelectorAll('.event-grid').forEach(function(grid){
  var gap=parseFloat(getComputedStyle(grid).rowGap)||10;
  var width=Math.min(grid.clientWidth,900);
  var cardWidth=(width-gap)/2;
  var tall=matchMedia('(max-width:650px)').matches?0.98:0.54;
  var page=grid.closest('.event-page');
  var available=Math.min(viewport.clientHeight,page?page.clientHeight:viewport.clientHeight);
  var height=Math.floor(Math.min((available-gap-14)/2,cardWidth*tall));
  grid.style.setProperty('--event-row-height',Math.max(90,height)+'px');
 });
}
